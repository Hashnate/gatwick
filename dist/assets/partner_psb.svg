<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 80' width='240' height='80'>
  <!-- Seal Emblem Group -->
  <g transform='translate(5, 5)'>
    <!-- Outer Ring Light Purple / Pink -->
    <circle cx='35' cy='35' r='33' fill='#ffffff' stroke='#c084fc' stroke-width='2' />
    <circle cx='35' cy='35' r='31' fill='#f5d0fe' stroke='#e879f9' stroke-width='1.5' />
    <circle cx='35' cy='35' r='24' fill='#ffffff' stroke='#d8b4fe' stroke-width='1' />
    
    <!-- Khmer Script Decorative Marks in Ring -->
    <circle cx='35' cy='7' r='1.5' fill='#a855f7' />
    <circle cx='7' cy='35' r='1.5' fill='#a855f7' />
    <circle cx='63' cy='35' r='1.5' fill='#a855f7' />
    <circle cx='35' cy='63' r='1.5' fill='#a855f7' />

    <!-- Inner Yellow Sunburst Circle -->
    <circle cx='35' cy='35' r='19' fill='#facc15' stroke='#eab308' stroke-width='1' />
    
    <!-- Sun Rays -->
    <g stroke='#ffffff' stroke-width='2' opacity='0.95'>
      <line x1='35' y1='17' x2='35' y2='53' />
      <line x1='17' y1='35' x2='53' y2='35' />
      <line x1='22' y1='22' x2='48' y2='48' />
      <line x1='22' y1='48' x2='48' y2='22' />
    </g>
    
    <!-- Inner White Halo -->
    <circle cx='35' cy='33' r='10' fill='#fef08a' />
    
    <!-- Lotus Base -->
    <ellipse cx='35' cy='44' rx='9' ry='3' fill='#f43f5e' />

    <!-- Seated Figure -->
    <path d='M 35 20 Q 40 26 35 33 Q 30 26 35 20 Z' fill='#d97706' />
    <circle cx='35' cy='23' r='2.5' fill='#fef08a' />
  </g>



  <!-- PSB Text Block -->
  <!-- PSB -->
  <text x='94' y='38' font-family='Impact, "Arial Black", "Plus Jakarta Sans", sans-serif' font-weight='900' font-size='32' fill='#27272a' letter-spacing='-0.5'>PSB</text>
  <!-- UNIVERSITY -->
  <text x='94' y='54' font-family='"Arial Black", "Plus Jakarta Sans", sans-serif' font-weight='800' font-size='13' fill='#3f3f46' letter-spacing='1.5'>UNIVERSITY</text>
  <!-- CAMBODIA -->
  <text x='94' y='68' font-family='"Plus Jakarta Sans", sans-serif' font-weight='600' font-size='11' fill='#71717a' letter-spacing='2.5'>CAMBODIA</text>


</svg>
