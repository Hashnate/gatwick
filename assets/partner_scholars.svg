<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 140' width='160' height='140'>
  <!-- Graduation Mortarboard Cap (Dark Navy Blue) -->
  <g fill='#1e3a8a'>
    <!-- Cap Diamond Top -->
    <polygon points='80,12 145,40 80,58 15,40' />
    <!-- Cap Under Base -->
    <path d='M 45 49 V 68 C 45 74, 115 74, 115 68 V 49 Z' />
    <!-- Tassel String & Skull Cap Hook -->
    <circle cx='80' cy='35' r='3' fill='#0f172a' />
    <path d='M 80 35 C 55 40, 32 50, 25 65' stroke='#0f172a' stroke-width='2.5' fill='none' />
    <!-- Tassel Fringe -->
    <polygon points='22,65 28,65 25,82' fill='#0f172a' />
  </g>

  <!-- Swirling Orbit Streams & Tech Nodes -->
  <!-- Orange Swirl stream 1 -->
  <path d='M 35 75 Q 80 50 140 30 Q 150 50 110 80 Q 70 100 35 75 Z' fill='none' stroke='#f97316' stroke-width='4' stroke-linecap='round' />
  <circle cx='140' cy='30' r='4' fill='#f97316' />
  <circle cx='35' cy='75' r='4' fill='#ea580c' />

  <!-- Yellow/Gold Swirl stream 2 -->
  <path d='M 38 90 Q 85 65 145 48' fill='none' stroke='#eab308' stroke-width='3.5' stroke-linecap='round' />
  <circle cx='60' cy='85' r='3' fill='#eab308' />

  <!-- Lime Green Swirl stream 3 -->
  <path d='M 45 105 Q 90 75 148 65 Q 120 115 65 110' fill='none' stroke='#84cc16' stroke-width='3.5' stroke-linecap='round' />
  <circle cx='148' cy='65' r='3.5' fill='#84cc16' />
  <circle cx='85' cy='112' r='3.5' fill='#65a30d' />

  <!-- Cyan/Blue Swirl stream 4 -->
  <path d='M 58 118 Q 110 95 152 42' fill='none' stroke='#06b6d4' stroke-width='3.5' stroke-linecap='round' />
  <circle cx='152' cy='42' r='4' fill='#0284c7' />
  <circle cx='140' cy='62' r='3.5' fill='#06b6d4' />
  <circle cx='100' cy='98' r='3' fill='#0284c7' />

  <!-- SCHOLARS CAMPUS Text -->
  <text x='80' y='132' font-family='Plus Jakarta Sans, Arial, sans-serif' font-weight='900' font-size='13' fill='#1e3a8a' text-anchor='middle' letter-spacing='0.5'>SCHOLARS CAMPUS</text>
</svg>
