<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 220 80' width='220' height='80'>
  <!-- Left red bar -->
  <rect x='0' y='0' width='14' height='80' fill='#cc0000' />

  <!-- Center IAU emblem block -->
  <!-- Red top-left square -->
  <rect x='18' y='0' width='36' height='40' fill='#cc0000' />
  <!-- Blue top-right square -->
  <rect x='54' y='0' width='36' height='40' fill='#1a4fa0' />
  <!-- Blue bottom-left square -->
  <rect x='18' y='40' width='36' height='40' fill='#1a4fa0' />
  <!-- Red bottom-right square -->
  <rect x='54' y='40' width='36' height='40' fill='#cc0000' />

  <!-- Globe grid lines (simplified) inside center -->
  <g stroke='#ffffff' stroke-width='1.2' opacity='0.7'>
    <!-- horizontal arcs (ellipses for globe latitude) -->
    <ellipse cx='54' cy='40' rx='34' ry='10' fill='none' />
    <ellipse cx='54' cy='40' rx='34' ry='20' fill='none' />
    <ellipse cx='54' cy='40' rx='34' ry='30' fill='none' />
    <ellipse cx='54' cy='40' rx='34' ry='38' fill='none' />
    <!-- vertical lines for globe longitude -->
    <line x1='54' y1='2' x2='54' y2='78' />
    <line x1='32' y1='2' x2='32' y2='78' />
    <line x1='76' y1='2' x2='76' y2='78' />
  </g>
  <!-- Globe outer circle clip ring -->
  <circle cx='54' cy='40' r='37' fill='none' stroke='#ffffff' stroke-width='1.5' />

  <!-- IAU text -->
  <text x='100' y='30' font-family='"Arial Black", Impact, sans-serif' font-weight='900' font-size='22' fill='#1a1a1a' letter-spacing='2'>IAU</text>
  <!-- Full name -->
  <text x='100' y='46' font-family='Arial, sans-serif' font-weight='600' font-size='7.5' fill='#333333' letter-spacing='0.3'>INTERNATIONAL</text>
  <text x='100' y='56' font-family='Arial, sans-serif' font-weight='600' font-size='7.5' fill='#333333' letter-spacing='0.3'>ASSOCIATION OF</text>
  <text x='100' y='66' font-family='Arial, sans-serif' font-weight='600' font-size='7.5' fill='#333333' letter-spacing='0.3'>UNIVERSITIES</text>
  <!-- Subtitle -->
  <text x='100' y='76' font-family='Arial, sans-serif' font-size='6' fill='#777777' letter-spacing='0.2'>International Universities Bureau</text>
</svg>
